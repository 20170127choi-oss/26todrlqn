<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 학생 성취도 분석 및 생기부 작성</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <header class="bg-white border-b border-slate-200 py-5 mb-6">
    <div class="max-w-5xl mx-auto px-4">
      <h1 class="text-xl font-bold text-slate-900">AI 학생 성취도 분석 및 생활기록부 작성 도우미</h1>
      <p class="text-sm text-slate-500 mt-1">평가 PDF를 업로드하면 학생별 시험지를 자동 구분해 채점·성취도 분석·생기부 초안을 생성합니다.</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 space-y-6 pb-16">
    <!-- 1. 평가 정보 -->
    <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <h2 class="font-bold text-base mb-4">1. 평가 기본 정보</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
        <div>
          <label class="block text-slate-600 font-medium mb-1">학년</label>
          <select id="grade" class="w-full border rounded-lg p-2.5">
            <option>1학년</option><option>2학년</option><option>3학년</option>
            <option>4학년</option><option selected>5학년</option><option>6학년</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">학기</label>
          <select id="semester" class="w-full border rounded-lg p-2.5">
            <option>1학기</option><option selected>2학기</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">과목</label>
          <input id="subject" type="text" value="수학" class="w-full border rounded-lg p-2.5" />
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">평가 영역</label>
          <input id="domain" type="text" value="자료와 가능성" class="w-full border rounded-lg p-2.5" />
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">평가 유형</label>
          <input id="evalType" type="text" value="단원 평가" class="w-full border rounded-lg p-2.5" />
        </div>
        <div>
          <label class="block text-slate-600 font-medium mb-1">성취기준 (선택)</label>
          <input id="standards" type="text" placeholder="예: [6수05-01] 자료를 수집하여 그림그래프로..." class="w-full border rounded-lg p-2.5" />
        </div>
      </div>
      <div class="mt-4 text-sm">
        <label class="block text-slate-600 font-medium mb-1">평가 기준</label>
        <input id="criteria" type="text" value="매우 잘함(개념을 정확히 이해하고 논리적 적용) / 잘함(핵심 개념 이해 및 기본 문제 해결) / 보통(부분적 이해) / 노력 요함(추가 학습 필요)" class="w-full border rounded-lg p-2.5" />
      </div>
    </section>

    <!-- 2. PDF 업로드 (label 태그로 직접 연결해 100% 클릭 보장) -->
    <section class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
      <h2 class="font-bold text-base mb-3">2. 학생 시험지 PDF 업로드</h2>
      <label for="fileInput" id="dropZone" class="block border-2 border-dashed border-slate-300 rounded-xl p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition">
        <p class="font-semibold text-slate-700">클릭하거나 PDF 파일을 이곳에 끌어다 놓으세요</p>
        <p class="text-xs text-slate-500 mt-1">학생 여러 명이 합쳐진 대용량 PDF도 자동으로 분할해 안전하게 분석합니다.</p>
      </label>
      <input id="fileInput" type="file" accept=".pdf,application/pdf" class="mt-3 text-sm text-slate-600" />
      <p id="fileInfo" class="text-sm font-semibold text-blue-600 mt-3 hidden"></p>
    </section>

    <button id="startBtn" type="button" class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-bold py-3.5 rounded-xl shadow-sm transition cursor-pointer">
      AI 성취도 분석 및 생활기록부 초안 생성 시작
    </button>

    <!-- 3. 진행 상황 -->
    <section id="progressBox" class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hidden">
      <div class="flex justify-between text-sm font-semibold mb-2">
        <span id="statusText">준비 중...</span>
        <span id="percentText">0%</span>
      </div>
      <div class="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-blue-600 h-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <p id="errorText" class="text-sm text-red-600 mt-3 hidden"></p>
    </section>

    <!-- 4. 결과 목록 -->
    <section id="resultSection" class="space-y-4 hidden">
      <div class="bg-white p-5 rounded-xl border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div id="summaryText" class="text-sm font-semibold"></div>
        <div class="flex gap-2">
          <button id="copyAllBtn" type="button" class="px-4 py-2 text-sm font-semibold border rounded-lg hover:bg-slate-100">전체 문장 복사</button>
          <button id="excelBtn" type="button" class="px-4 py-2 text-sm font-semibold bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">엑셀(.xlsx) 다운로드</button>
        </div>
      </div>
      <div id="studentList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let selectedFile = null;
    let results = [];

    const dropZone = $('dropZone');
    const fileInput = $('fileInput');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-blue-500', 'bg-blue-50');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-blue-500', 'bg-blue-50');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500', 'bg-blue-50');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        setFile(e.dataTransfer.files[0]);
      }
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        setFile(e.target.files[0]);
      }
    });

    function setFile(file) {
      selectedFile = file;
      $('fileInfo').textContent = `선택된 파일: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      $('fileInfo').classList.remove('hidden');
    }

    function uint8ToBase64(bytes) {
      let binary = '';
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    async function buildSlicePdfBase64(srcDoc, startPage1Based, endPage1Based) {
      const { PDFDocument } = window.PDFLib;
      const newDoc = await PDFDocument.create();
      const total = srcDoc.getPageCount();
      const start = Math.max(0, startPage1Based - 1);
      const end = Math.min(total - 1, endPage1Based - 1);
      const indices = [];
      for (let i = start; i <= end; i++) indices.push(i);
      const copied = await newDoc.copyPages(srcDoc, indices);
      copied.forEach((p) => newDoc.addPage(p));
      const bytes = await newDoc.save();

      const sizeMb = bytes.byteLength / (1024 * 1024);
      if (sizeMb > 3.5) {
        throw new Error(`${startPage1Based}~${endPage1Based}페이지 용량(${sizeMb.toFixed(1)}MB)이 3.5MB를 초과합니다. 스캔 해상도를 낮춰 주세요.`);
      }
      return uint8ToBase64(bytes);
    }

    async function postAnalyze(payload) {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const rawText = await res.text();
      let data;
      try {
        data = JSON.parse(rawText);
      } catch {
        if (res.status === 413) throw new Error('전송 용량 초과(413): 스캔 해상도가 너무 높습니다.');
        if (res.status === 504) throw new Error('서버 응답 시간 초과(504): 다시 시도해 주세요.');
        throw new Error(`서버 오류(${res.status}): ${rawText.slice(0, 120)}`);
      }

      if (!res.ok) {
        throw new Error(data.error || `요청 실패 (${res.status})`);
      }
      return data;
    }

    $('startBtn').addEventListener('click', async () => {
      if (!selectedFile) {
        alert('먼저 학생 시험지 PDF를 선택해 주세요.');
        return;
      }
      if (!window.PDFLib) {
        alert('PDF 처리 라이브러리를 불러오는 중입니다. 3초 후 다시 눌러주세요.');
        return;
      }

      $('startBtn').disabled = true;
      $('progressBox').classList.remove('hidden');
      $('errorText').classList.add('hidden');
      $('studentList').innerHTML = '';
      results = [];

      const info = {
        grade: $('grade').value,
        semester: $('semester').value,
        subject: $('subject').value,
        domain: $('domain').value,
        evalType: $('evalType').value,
        standards: $('standards').value,
        criteria: $('criteria').value
      };

      try {
        updateProgress(5, '1단계: PDF 파일을 불러오는 중...');
        const { PDFDocument } = window.PDFLib;
        const arrayBuffer = await selectedFile.arrayBuffer();
        const srcDoc = await PDFDocument.load(arrayBuffer);
        const totalPages = srcDoc.getPageCount();

        let allStudents = [];
        const chunkPages = 2;
        for (let p = 1; p <= totalPages; p += chunkPages) {
          const endP = Math.min(totalPages, p + chunkPages - 1);
          const scanPct = 5 + Math.round((endP / totalPages) * 20);
          updateProgress(scanPct, `1단계: 학생별 시험지 구간 확인 중... (${endP}/${totalPages}페이지)`);

          const sliceBase64 = await buildSlicePdfBase64(srcDoc, p, endP);
          const data = await postAnalyze({ mode: 'structure', pdfBase64: sliceBase64 });

          (data.students || []).forEach((st) => {
            const realStart = p + st.page_start - 1;
            const realEnd = p + st.page_end - 1;
            const prev = allStudents[allStudents.length - 1];
            if (prev && prev.student_name === st.student_name && st.student_name !== '미확인') {
              prev.page_end = realEnd;
            } else {
              allStudents.push({
                ...st,
                page_start: realStart,
                page_end: realEnd
              });
            }
          });
        }

        if (allStudents.length === 0) {
          throw new Error('PDF에서 학생 시험지를 구분하지 못했습니다.');
        }

        $('resultSection').classList.remove('hidden');
        const existingDrafts = [];

        for (let i = 0; i < allStudents.length; i++) {
          const st = allStudents[i];
          const pct = 25 + Math.round(((i + 1) / allStudents.length) * 75);
          updateProgress(pct, `2단계: [${st.student_name}] 학생 채점 및 생기부 작성 중... (${i + 1}/${allStudents.length}명)`);

          const studentPdfBase64 = await buildSlicePdfBase64(srcDoc, st.page_start, st.page_end);
          const analysis = await postAnalyze({
            mode: 'student',
            pdfBase64: studentPdfBase64,
            info,
            student: st,
            existingDrafts
          });

          existingDrafts.push(analysis.record_draft);
          const recordItem = { ...st, ...analysis };
          results.push(recordItem);
          appendStudentCard(recordItem);
          $('summaryText').textContent = `총 ${allStudents.length}명 중 ${results.length}명 분석 완료`;
        }

        updateProgress(100, '모든 학생의 성취도 분석 및 생활기록부 초안 생성이 완료되었습니다!');
      } catch (err) {
        $('errorText').textContent = `오류: ${err.message}`;
        $('errorText').classList.remove('hidden');
      } finally {
        $('startBtn').disabled = false;
      }
    });

    function updateProgress(pct, text) {
      $('progressBar').style.width = `${pct}%`;
      $('percentText').textContent = `${pct}%`;
      $('statusText').textContent = text;
    }

    function appendStudentCard(st) {
      const card = document.createElement('div');
      card.className = 'bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-3';
      const warnBadge = (st.status === 'needs_review' || st.review_needed)
        ? `<span class="text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">확인 필요</span>` : '';

      const qDetails = (st.questions || [])
        .map((q) => `• ${q.q_num}번 (${q.score}/${q.max_score}점): 응답 "${q.student_ans}" → ${q.reason}`)
        .join('\n');

      card.innerHTML = `
        <div class="flex justify-between items-center">
          <div class="font-bold text-base text-blue-700">${st.student_number ? st.student_number + '번 ' : ''}${st.student_name} <span class="text-xs font-normal text-slate-400">(${st.page_start}~${st.page_end}p)</span></div>
          <div class="flex gap-1.5 items-center">
            ${warnBadge}
            <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700">${st.achievement_level} (${st.total_score}/${st.max_score}점)</span>
          </div>
        </div>
        <div class="text-xs text-slate-600 space-y-1 bg-slate-50 p-3 rounded-lg">
          <div><strong class="text-slate-800">강점:</strong> ${st.strengths}</div>
          <div><strong class="text-slate-800">보완:</strong> ${st.improvements}</div>
        </div>
        <textarea class="draft-box w-full border rounded-lg p-3 text-sm leading-relaxed" rows="4">${st.record_draft}</textarea>
        <details class="text-xs text-slate-500">
          <summary class="cursor-pointer font-medium hover:text-slate-800">문항별 채점 근거 보기</summary>
          <pre class="mt-2 whitespace-pre-wrap bg-slate-50 p-2.5 rounded border text-slate-600">${qDetails}</pre>
        </details>
        <div class="flex justify-end">
          <button type="button" class="copy-btn px-3 py-1.5 text-xs font-semibold border rounded-lg hover:bg-slate-100">문장 복사</button>
        </div>
      `;

      card.querySelector('.draft-box').addEventListener('input', (e) => {
        st.record_draft = e.target.value;
      });
      card.querySelector('.copy-btn').addEventListener('click', () => {
        navigator.clipboard.writeText(st.record_draft);
        alert(`${st.student_name} 학생 문장이 복사되었습니다.`);
      });
      $('studentList').appendChild(card);
    }

    $('copyAllBtn').addEventListener('click', () => {
      const text = results.map((r) => `[${r.student_number ? r.student_number + '번 ' : ''}${r.student_name}]\n${r.record_draft}`).join('\n\n');
      navigator.clipboard.writeText(text);
      alert('전체 학생의 생활기록부 문장이 복사되었습니다.');
    });

    $('excelBtn').addEventListener('click', () => {
      const rows = results.map((r) => ({
        '번호': r.student_number || '',
        '이름': r.student_name,
        '총점': `${r.total_score}/${r.max_score}`,
        '성취수준': r.achievement_level,
        '강점': r.strengths,
        '보완점': r.improvements,
        '생활기록부 초안': r.record_draft
      }));
      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '생활기록부');
      XLSX.writeFile(wb, '학생_성취도_및_생활기록부.xlsx');
    });
  </script>
</body>
</html>
